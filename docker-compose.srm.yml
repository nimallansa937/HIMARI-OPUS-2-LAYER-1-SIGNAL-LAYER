version: '3.8'

services:
  srm:
    build:
      context: .
      dockerfile: Dockerfile.srm
    environment:
      - SRM_REDIS_URL=redis://redis:6379
      - SRM_SYMBOLS=BTCUSDT,ETHUSDT
      - SRM_DRY_RUN=true
      - SRM_TELEGRAM_BOT_TOKEN=${SRM_TELEGRAM_BOT_TOKEN:-}
      - SRM_TELEGRAM_CHAT_ID=${SRM_TELEGRAM_CHAT_ID:-}
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - himari
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - himari
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

