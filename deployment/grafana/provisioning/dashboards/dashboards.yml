# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: "HIMARI Dashboards"
    orgId: 1
    folder: "HIMARI Signal Layer"
    folderUid: "himari-dashboards"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
