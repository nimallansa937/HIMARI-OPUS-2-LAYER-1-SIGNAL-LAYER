# HIMARI Signal Layer Alert Rules

groups:
  # =================================================================
  # LATENCY ALERTS
  # =================================================================
  - name: latency
    rules:
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(himari_latency_seconds_bucket[5m])) > 0.025
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency exceeds 25ms"
          description: "P99 latency is {{ $value | humanizeDuration }} for {{ $labels.component }}"

      - alert: CriticalLatency
        expr: histogram_quantile(0.99, rate(himari_latency_seconds_bucket[1m])) > 0.050
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: P99 latency exceeds 50ms"
          description: "P99 latency is {{ $value | humanizeDuration }}. Consider rollback."

  # =================================================================
  # ERROR RATE ALERTS
  # =================================================================
  - name: errors
    rules:
      - alert: HighErrorRate
        expr: rate(himari_errors_total[5m]) / rate(himari_requests_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate exceeds 1%"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.component }}"

      - alert: CriticalErrorRate
        expr: rate(himari_errors_total[5m]) / rate(himari_requests_total[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Error rate exceeds 5%"
          description: "Error rate is {{ $value | humanizePercentage }}. Immediate action required."

  # =================================================================
  # SENTIMENT ANALYSIS ALERTS
  # =================================================================
  - name: sentiment
    rules:
      - alert: SentimentAnalysisSlow
        expr: histogram_quantile(0.95, rate(himari_sentiment_latency_seconds_bucket[5m])) > 0.010
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sentiment analysis P95 latency > 10ms"
          description: "Sentiment analyzer is running slowly at {{ $value | humanizeDuration }}"

      - alert: SentimentModelUnavailable
        expr: himari_sentiment_model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentiment model not loaded"
          description: "Financial-RoBERTa model is not available"

  # =================================================================
  # SHADOW MODE ALERTS
  # =================================================================
  - name: shadow_mode
    rules:
      - alert: SignalDivergenceHigh
        expr: himari_shadow_signal_divergence > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Shadow mode signal divergence > 15%"
          description: "Enhanced signals diverging from legacy by {{ $value | humanizePercentage }}"

      - alert: RegimeMismatchRateHigh
        expr: 1 - himari_shadow_regime_match_rate > 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Shadow mode regime mismatch rate > 10%"
          description: "Regime detection mismatch rate is {{ $value | humanizePercentage }}"

  # =================================================================
  # ROLLOUT ALERTS
  # =================================================================
  - name: rollout
    rules:
      - alert: RolloutCriteriaNotMet
        expr: himari_rollout_criteria_met == 0 and himari_rollout_duration_hours > 24
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Rollout phase criteria not met after 24h"
          description: "Phase {{ $labels.phase }} has been running for {{ $value }}h without meeting advancement criteria"

      - alert: RollbackTriggered
        expr: increase(himari_rollback_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Symbol rollback triggered"
          description: "Rollback occurred for {{ $labels.symbol }}: {{ $labels.reason }}"

  # =================================================================
  # INFRASTRUCTURE ALERTS
  # =================================================================
  - name: infrastructure
    rules:
      - alert: RedisConnectionFailed
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis connection lost"
          description: "Unable to connect to Redis for state persistence"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 / 1024 > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage exceeds 4GB"
          description: "Current memory usage is {{ $value | humanize }}GB"
