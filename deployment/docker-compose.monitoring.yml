version: '3.8'

# HIMARI Signal Layer - Monitoring Stack
# Prometheus + Grafana for production monitoring

services:
  # =================================================================
  # PROMETHEUS - Metrics Collection
  # =================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: himari-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - himari-monitoring

  # =================================================================
  # GRAFANA - Visualization & Dashboards
  # =================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: himari-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-himari2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    depends_on:
      - prometheus
    networks:
      - himari-monitoring

  # =================================================================
  # ALERTMANAGER - Alert Routing
  # =================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: himari-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - himari-monitoring

  # =================================================================
  # NODE EXPORTER - Host Metrics
  # =================================================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: himari-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - himari-monitoring

  # =================================================================
  # REDIS EXPORTER - Redis Metrics
  # =================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: himari-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
    networks:
      - himari-monitoring

networks:
  himari-monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
