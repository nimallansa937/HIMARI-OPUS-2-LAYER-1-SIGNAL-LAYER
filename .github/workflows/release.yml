name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests before release
        run: |
          pip install numpy pytest
          python quick_test.py

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## HIMARI L1 Signal Layer Release

            ### Features
            - 5-tier streaming signal processing pipeline
            - 50-dimensional feature vector output
            - 6.5μs latency per update
            - Kafka/Redis integration

            ### Components
            - **Tier 5**: Welford, Kalman, GARCH, T-Digest, Hurst, Volume
            - **Tier 4**: HMM, Ultimate Smoother, RLS
            - **Tier 3**: Lorentzian KNN, KRLS, TINs, Ensemble
            - **Tier 1**: Dempster-Shafer, Fuzzy Logic

            ### Validation
            - Deflated Sharpe Ratio (DSR)
            - CPCV with purge/embargo
            - White's Reality Check + Hansen's SPA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
