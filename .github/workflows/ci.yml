name: HIMARI L1 Signal Layer CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run quick tests
        run: |
          python quick_test.py

      - name: Test component imports
        run: |
          python -c "
          print('Testing Tier 5: Streaming Primitives...')
          from primitives import WelfordVariance, KalmanFilter, OnlineGARCH
          from primitives import StreamingQuantiles, MovingHurst
          from primitives import SyntheticVolumeDelta, RelativeVolume, OrderBookImbalance
          print('✓ Tier 5 OK')

          print('Testing Tier 3: ML Layer...')
          from ml import LorentzianKNN, EnsembleFusion, KernelRLS
          print('✓ Tier 3 OK')

          print('Testing Tier 1: Signal Fusion...')
          from fusion import DempsterShafer, FuzzySignalMapper
          print('✓ Fusion OK')

          print('Testing Validation Framework...')
          from validation import DeflatedSharpeRatio, CPCVValidator, WhiteSPATest
          from validation import TransactionCostModel
          print('✓ Validation OK')

          print('Testing Feature Vector...')
          from feature_vector import FeatureVectorAssembler
          print('✓ Feature Vector OK')

          print('Testing Regime Detection...')
          from regime import StreamingHMM
          print('✓ Regime OK')

          print('')
          print('All component imports successful! ✅')
          "

      - name: Latency benchmark
        run: |
          python -c "
          import time
          import numpy as np
          from primitives import WelfordVariance, KalmanFilter, OnlineGARCH
          from regime import StreamingHMM

          # Initialize
          welford = WelfordVariance()
          kalman = KalmanFilter(0.01, 0.1)
          garch = OnlineGARCH()
          hmm = StreamingHMM(3)

          # Warmup
          for _ in range(100):
              price = 100 + np.random.randn()
              ret = np.random.randn() * 0.02
              welford.update(ret)
              kalman.update(price)
              garch.update(ret)
              hmm.update(ret)

          # Benchmark
          iterations = 10000
          start = time.perf_counter()
          for _ in range(iterations):
              price = 100 + np.random.randn()
              ret = np.random.randn() * 0.02
              welford.update(ret)
              kalman.update(price)
              garch.update(ret)
              hmm.update(ret)
          elapsed = time.perf_counter() - start

          latency_us = (elapsed / iterations) * 1e6
          print(f'Latency: {latency_us:.1f}μs per complete update cycle')
          print(f'Target: <10ms (10000μs)')

          if latency_us < 10000:
              print('✅ Performance target met!')
          else:
              print('⚠️ Performance target not met')
              exit(1)
          "

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings for complexity (optional)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
