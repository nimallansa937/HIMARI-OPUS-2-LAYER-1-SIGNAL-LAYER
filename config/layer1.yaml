# HIMARI Layer 1 Explorer Configuration

# Logging
log_level: INFO

# Generation cycle settings
cycle_interval_seconds: 3600  # 1 hour between cycles
max_cycles_per_day: 24

# Strategy Generation
generation:
  # Budget allocation (must sum to 1.0)
  evolutionary_pct: 0.40
  generative_pct: 0.25
  llm_guided_pct: 0.20
  external_pct: 0.15

  # Generation parameters
  total_candidates_per_cycle: 100
  max_llm_calls_per_cycle: 20
  diversity_threshold: 0.85

  # Evolutionary parameters
  population_size: 100
  elite_count: 10
  tournament_size: 5
  mutation_rate: 0.15
  crossover_rate: 0.7

  # Flow matching parameters
  flow_steps: 15
  cfg_scale: 7.5

# HIFA Validation Pipeline
validation:
  # Stage thresholds
  min_sharpe: 0.5
  max_drawdown: 0.20
  min_profit_factor: 1.1
  min_trade_count: 50

  # DSR parameters
  dsr_multiple_testing_penalty: 0.1
  min_dsr: 1.5

  # True contribution thresholds
  min_marginal_sharpe: 0.2
  min_orthogonality: 0.3
  min_residual_ic: 0.01

  # Neutralization thresholds
  min_ic_retention: 0.50

  # Batch processing
  batch_size: 50
  stage2_top_k: 30
  stage3_top_k: 10

# Deployment Pipeline
deployment:
  # Shadow trading
  min_shadow_days: 21
  min_transfer_ratio: 0.70
  max_epistemic_uncertainty: 0.10

  # Position sizing
  base_position_pct: 0.05
  max_position_pct: 0.20
  scale_up_threshold: 0.75
  scale_down_threshold: 0.60

  # Monitoring
  daily_tr_check: true
  weekly_regime_check: true
  monthly_full_review: true

# Adaptation Systems
adaptation:
  # Drift detection
  adwin_delta: 0.002
  page_hinkley_delta: 0.005
  page_hinkley_threshold: 50.0
  kswin_window_size: 100
  kswin_stat_size: 30
  kswin_alpha: 0.005
  drift_vote_threshold: 2

  # Response levels (transfer ratio thresholds)
  yellow_threshold: 0.65
  orange_threshold: 0.55
  red_threshold: 0.45

  # MAML parameters
  inner_lr: 0.01
  outer_lr: 0.001
  adaptation_steps: 5

  # Retirement
  min_tr_for_survival: 0.50
  max_consecutive_failures: 3
  winddown_days: 7

# LLM Configuration - DeepSeek as sole provider
llm:
  # Primary: DeepSeek API
  primary_provider: deepseek
  primary_model: deepseek-chat
  primary_api_key: sk-e928b23d6fa245e188a2c18f85d9ff61
  primary_base_url: https://api.deepseek.com

  # All tasks use DeepSeek
  strategy_generation_provider: primary
  knowledge_extraction_provider: primary
  idea_harvesting_provider: primary
  mutation_guidance_provider: primary

  # Rate limiting
  max_requests_per_minute: 60
  timeout_seconds: 120

# Infrastructure
infrastructure:
  # Redis
  redis_host: localhost
  redis_port: 6379
  redis_db: 0
  redis_password: ${REDIS_PASSWORD}

  # Kafka
  kafka_bootstrap_servers: localhost:9092
  kafka_group_id: layer1-explorer

  # Neo4j
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
  neo4j_password: ${NEO4J_PASSWORD}

  # Prometheus
  metrics_port: 8000
  metrics_enabled: true

# Web Crawler
crawler:
  # Sources
  arxiv_enabled: true
  arxiv_categories:
    - q-fin.TR
    - q-fin.PM
    - q-fin.ST
  max_papers_per_crawl: 20

  # Rate limiting
  requests_per_second: 0.5
  max_retries: 3

  # Storage
  sqlite_path: data/knowledge.db
  cache_ttl_hours: 24

  # Extraction
  min_relevance_score: 0.3
